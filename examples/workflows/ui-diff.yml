# Copy to .github/workflows/ui-diff.yml. Posts before/after screenshots on every PR push.
name: UI diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # push screenshots to the ui-diff-assets branch
  pull-requests: write   # add / update the PR comment
  # statuses: write      # with require-approval: the ui-diff/design-review status

# A newer push replaces a run that's still going.
concurrency:
  group: ui-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ui-diff:
    runs-on: ubuntu-latest
    steps:
      # The PR head itself (not the merge commit), with history so the base can be found.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Install the project's dependencies yourself. ui-diff reuses them for head, and for
      # base when the lockfile is the same (otherwise it runs the install for base).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: davidamunga/ui-diff@v0
        # with:
        #   routes: /,/pricing        # default: picked from the changed files (or .ui-diff.json routes)
        #   dev-command: npm run dev -- --port {port}
        #   viewports: desktop:1440x900,mobile:iPhone 13
        #   color-schemes: light,dark
        #   mode: description         # put it in the PR description instead of a comment
        #   require-approval: true    # design review gate; add ui-diff-approve.yml too

      # Optional: keep the full report and the server/capture logs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-diff-report
          path: |
            .ui-diff/report
            .ui-diff/*.log
          include-hidden-files: true
          if-no-files-found: ignore
